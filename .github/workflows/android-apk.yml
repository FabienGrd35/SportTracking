name: APK Android

# Compile l'appli sur les serveurs GitHub et publie l'APK dans la release « latest-apk ».
# Lien de téléchargement fixe :
#   https://github.com/<owner>/<repo>/releases/download/latest-apk/SportTracking.apk
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Tests
        run: npm test

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SportTracking.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk SportTracking.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SportTracking — build ${GITHUB_RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Ouvrir ce lien sur le téléphone Android et installer SportTracking.apk."
